# Publishes site/ to the "andrewwinn" Azure Static Web App (winn-apps.uk) on every push to main.
# Needs the secret AZURE_STATIC_WEB_APPS_API_TOKEN in the "main" environment (Azure › andrewwinn › Manage deployment token).
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/checkout@v4
      - name: Upload site to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          output_location: ""
          skip_app_build: true
